<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="150">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .prompt {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 500;
      fill: #58a6ff;
      letter-spacing: 0.5px;
    }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 34px;
      font-weight: 700;
      fill: #f0f6fc;
      letter-spacing: -0.5px;
    }
    .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 400;
      fill: #8b949e;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #79c0ff;
    }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="148" rx="8" fill="url(#cardBg)" stroke="#30363d" stroke-width="1"/>
  
  <!-- Subtle Grid Pattern in background -->
  <rect x="2" y="2" width="896" height="146" rx="7" fill="url(#grid)" />

  <!-- Accent top border stripe -->
  <rect x="1" y="1" width="898" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Left Content -->
  <text x="36" y="38" class="prompt">const engineer = "A. Karthick"; // Backend &amp; Generative AI Systems</text>
  <text x="36" y="78" class="name">A. Karthick</text>
  <text x="36" y="104" class="desc">Python Developer &amp; Systems Engineer &nbsp;•&nbsp; Building Autonomous Agents (FastMCP), RAG Pipelines &amp; High-Throughput APIs</text>

  <!-- Status / Pill Tags -->
  <g transform="translate(36, 118)">
    <rect x="0" y="0" width="105" height="20" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="1"/>
    <text x="8" y="14" class="badge-text">⚡ FASTAPI</text>

    <rect x="113" y="0" width="112" height="20" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="1"/>
    <text x="8" y="14" class="badge-text" transform="translate(113,0)">🤖 FASTMCP</text>

    <rect x="233" y="0" width="125" height="20" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="1"/>
    <text x="8" y="14" class="badge-text" transform="translate(233,0)">🧠 RAG &amp; VECTOR</text>

    <rect x="366" y="0" width="115" height="20" rx="4" fill="#1f242c" stroke="#30363d" stroke-width="1"/>
    <text x="8" y="14" class="badge-text" transform="translate(366,0)">🐧 LINUX CORE</text>
  </g>

  <!-- Right Decorative Architecture Nodes -->
  <g transform="translate(740, 28)" opacity="0.85">
    <!-- Network nodes -->
    <line x1="20" y1="20" x2="65" y2="45" stroke="#30363d" stroke-width="1.5"/>
    <line x1="65" y1="45" x2="110" y2="20" stroke="#30363d" stroke-width="1.5"/>
    <line x1="65" y1="45" x2="65" y2="90" stroke="#30363d" stroke-width="1.5"/>
    <line x1="20" y1="70" x2="65" y2="90" stroke="#30363d" stroke-width="1.5"/>
    <line x1="110" y1="70" x2="65" y2="90" stroke="#30363d" stroke-width="1.5"/>

    <circle cx="20" cy="20" r="5" fill="#58a6ff"/>
    <circle cx="110" cy="20" r="4" fill="#79c0ff"/>
    <circle cx="65" cy="45" r="7" fill="#1f6feb"/>
    <circle cx="20" cy="70" r="4" fill="#58a6ff"/>
    <circle cx="110" cy="70" r="4" fill="#79c0ff"/>
    <circle cx="65" cy="90" r="5" fill="#58a6ff"/>
  </g>
</svg>
