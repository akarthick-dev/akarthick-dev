<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 1px;
      fill: #94A3B8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #38BDF8;
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="176" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="100" cy="40" r="80" fill="#00F5FF" opacity="0.08" filter="url(#glow)"/>
  <circle cx="800" cy="140" r="100" fill="#A855F7" opacity="0.08" filter="url(#glow)"/>

  <!-- Arch Linux stylized logo mark -->
  <g transform="translate(48, 45) scale(0.9)" opacity="0.95">
    <path d="M 45 5 C 42 12 30 35 24 47 C 28 51 34 53 40 55 C 36 47 38 41 41 38 C 44 41 47 48 44 56 C 51 54 58 52 64 47 Z" fill="url(#textGrad)"/>
    <path d="M 45 5 L 8 80 L 26 80 C 31 69 36 57 41 46 C 43 51 46 62 49 71 L 62 71 C 55 52 48 31 45 5 Z" fill="#38BDF8" opacity="0.5"/>
  </g>

  <!-- Content -->
  <text x="140" y="70" class="title">A. KARTHICK</text>
  <text x="142" y="102" class="subtitle">Python Developer &amp; Generative AI Systems Architect</text>

  <!-- Tag Pills -->
  <g transform="translate(142, 122)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="17" class="tag">⚡ FastMCP AGENTS</text>

    <!-- Pill 2 -->
    <rect x="140" y="0" width="105" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="17" class="tag" transform="translate(140, 0)">🎙️ VOICE AI</text>

    <!-- Pill 3 -->
    <rect x="255" y="0" width="140" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="17" class="tag" transform="translate(255, 0)">🧠 RAG PIPELINES</text>

    <!-- Pill 4 -->
    <rect x="405" y="0" width="130" height="26" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="17" class="tag" transform="translate(405, 0)">🐧 ARCH LINUX</text>
  </g>
</svg>
